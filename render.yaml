services:
  - type: web
    name: txtzi
    runtime: docker
    plan: standard
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: txtzi-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6.1-sol
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: XAI_API_KEY
        sync: false
      - key: XAI_MODEL
        value: grok-4.7
      - key: OPENAI_REASONING_EFFORT
        value: medium
      - key: XAI_REASONING_EFFORT
        value: low
      - key: DETECTOR_PROVIDER
        value: local
      - key: GPTZERO_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CURRENCY
        value: usd
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_TOKEN
        sync: false
      - key: WEEKLY_FREE_CREDITS
        value: "500"

databases:
  - name: txtzi-db
    plan: basic-256mb
    region: frankfurt
    diskSizeGB: 1
